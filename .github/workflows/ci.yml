name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build (warnings as errors)
        run: dotnet build --no-restore -c Release
      # Integration test khởi động SQL Server bằng Testcontainers (Docker có sẵn trên runner).
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    env:
      # Giá trị giả chỉ để kiểm tra cấu hình; job này không khởi động các container.
      MSSQL_SA_PASSWORD: ci-placeholder-not-a-secret
      JWT_SIGNING_KEY: ci-placeholder-not-a-secret-0123456789abcdef
      FIELD_ENCRYPTION_KEY: Y2ktcGxhY2Vob2xkZXItbm90LWEtc2VjcmV0LTAwMDA=
      BLIND_INDEX_KEY: Y2ktcGxhY2Vob2xkZXItbm90LWEtc2VjcmV0LTExMTE=
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
